services:
  auth-db:
    image: postgres:17
    environment:
      POSTGRES_DB: authservice_db
      POSTGRES_USER: user
      POSTGRES_PASSWORD: secret
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "user", "-d", "authservice_db"]
      interval: 5s
      timeout: 3s
      retries: 10

  auth-service:
    image: ghcr.io/roob1e/jac_authservice:latest
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_URL: jdbc:postgresql://auth-db:5432/authservice_db
      DB_USER: user
      DB_PASSWORD: secret
      USER_SERVICE_URL: http://user-service:8081
    depends_on:
      auth-db:
        condition: service_healthy

  user-db:
    image: postgres:17
    environment:
      POSTGRES_DB: users
      POSTGRES_USER: user
      POSTGRES_PASSWORD: secret
    healthcheck:
      test: [ "CMD", "pg_isready", "-U", "user", "-d", "users" ]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8.10
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  user-service:
    image: ghcr.io/roob1e/jac_userservice:latest
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_URL: jdbc:postgresql://user-db:5432/users
      DB_USER: user
      DB_PASSWORD: secret
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWKS_URI: http://auth-service:8082/.well-known/jwks.json
    depends_on:
      user-db:
        condition: service_healthy
      redis:
        condition: service_healthy

  api-gateway:
    image: ghcr.io/roob1e/jac_api_gateway
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      AUTH_SERVICE_URL: http://auth-service:8082
      USER_SERVICE_URL: http://user-service:8081
    depends_on:
      - auth-service
      - user-service